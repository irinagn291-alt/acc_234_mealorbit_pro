name: MealOrbit
options:
  bundleIdPrefix: com.mealorbit
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  Alamofire:
    url: https://github.com/wrandecima-bit/Alamofire
    revision: 7fdd403089757be2ce6991b287c7bef612c8bd04
settings:
  base:
    SWIFT_VERSION: "6.2"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGNING_ALLOWED: "NO"
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  MealOrbit:
    type: application
    platform: iOS
    sources:
      - path: MealOrbit
        excludes:
          - "**/*.md"
          - "**/LICENSE"
    dependencies:
      - package: Alamofire
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mealorbit.orbit
        PRODUCT_NAME: MealOrbit
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: MealOrbit
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_NSCameraUsageDescription: MealOrbit reads barcodes to lock a product into an orbit window.
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.healthcare-fitness
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0.0"
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        SUPPORTS_MACCATALYST: "NO"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: "NO"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UIRequiresFullScreen: NO
        ENABLE_TESTABILITY: YES
        SWIFT_VERSION: "6.2"
        CODE_SIGNING_REQUIRED: "NO"
    info:
      path: MealOrbit/Info.plist
      properties:
        UILaunchStoryboardName: LaunchScreen
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).OrbitSceneDelegate
  MealOrbitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MealOrbitTests
    dependencies:
      - target: MealOrbit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mealorbit.orbit.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: "NO"
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_VERSION: "6.2"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        ENABLE_TESTABILITY: YES
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/MealOrbit.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/MealOrbit
  MealOrbitUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: MealOrbitUITests
    dependencies:
      - target: MealOrbit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mealorbit.orbit.uitests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: "NO"
        TEST_TARGET_NAME: MealOrbit
        TARGETED_DEVICE_FAMILY: "1,2"
schemes:
  MealOrbit:
    build:
      targets:
        MealOrbit: all
        MealOrbitTests: [test]
        MealOrbitUITests: [test]
    test:
      gatherCoverageData: false
      targets:
        - MealOrbitTests
        - MealOrbitUITests
